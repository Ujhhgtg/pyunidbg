[project]
name = "pyunidbg"
version = "0.1.0"
description = "Python bindings for unidbg Android ARM64 emulation"
readme = "README.md"
authors = [
    { name = "Ujhhgtg", email = "feyxiexzf@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "jpype1>=1.7,<1.8",
    "mcp>=1.26",
]

[project.optional-dependencies]
wechatx = [
    "msgpack>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = true

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
